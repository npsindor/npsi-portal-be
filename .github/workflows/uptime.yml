# Uptime check: every 15 minutes, both backends must answer /api/v1/health with
# ok:true (the database is reachable). A failed run makes GitHub email whoever
# last changed this schedule (default notification setting: failed workflows).
# Scheduled workflows only run from the default branch (main).
name: Uptime

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        site: [https://api.npsindore.org, https://api-test.npsindore.org]
    steps:
      - name: ${{ matrix.site }}/api/v1/health
        run: |
          for attempt in 1 2 3; do
            if curl -sS -m 15 "${{ matrix.site }}/api/v1/health" | jq -e '.ok == true' >/dev/null 2>&1; then echo "healthy"; exit 0; fi
            echo "attempt $attempt failed, retrying in 20s"; sleep 20
          done
          echo "::error::${{ matrix.site }} is not healthy (3 attempts)"; exit 1
