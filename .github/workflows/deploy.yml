# Deploys the backend to its Hostinger Node.js site.
#
#   main -> "production" environment (waits for a required reviewer to approve)
#           -> darkgray-starling-318391.hostingersite.com (api.npsindore.org)
#   test -> "test" environment (no approval, deploys automatically)
#           -> saddlebrown-newt-991262.hostingersite.com (api-test.npsindore.org)
#
# Push (or "Run workflow" in the Actions tab) -> checks (Biome, build, unit, e2e and contract tests on a throwaway MySQL)
# -> Hostinger clones the branch, runs the `build` npm script and starts dist/main.js
# -> /api/v1/health must answer ok.
#
# Needs, on each environment:
#   secret   HOSTINGER_API_TOKEN              hPanel -> Account -> API
#   variable HOSTINGER_GIT_INSTALLATION_UUID  the GitHub connection made in hPanel -> Git
# App env vars (DB, SMTP, reCAPTCHA, ...) live in hPanel, not here.
name: Deploy backend

on:
  push:
    branches: [main, test]
  workflow_dispatch:

permissions:
  contents: read

# One deploy per branch at a time; a newer run replaces an older one still
# waiting for approval, but never cancels a deploy that is already running.
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  HOSTINGER_API: https://developers.hostinger.com/api/hosting/v1
  HOSTINGER_USERNAME: u465324772
  HOSTINGER_DOMAIN: ${{ github.ref_name == 'main' && 'darkgray-starling-318391.hostingersite.com' || 'saddlebrown-newt-991262.hostingersite.com' }}
  PUBLIC_URL: ${{ github.ref_name == 'main' && 'https://api.npsindore.org' || 'https://api-test.npsindore.org' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Throwaway MySQL for the e2e and contract suites (they create and drop their own databases).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci-root"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-root
      CONTRACT_MYSQL_HOST: 127.0.0.1
      CONTRACT_MYSQL_USER: root
      CONTRACT_MYSQL_PASSWORD: ci-root
      LOG_REQUESTS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format check (Biome)
        run: npm run check
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: e2e tests (real MySQL)
        run: npm run test:e2e
      - name: Contract tests (every endpoint, black-box)
        run: npm run test:contract
      - name: Syntax-check scripts
        run: for f in scripts/*.mjs; do node --check "$f"; done

  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'test' }}
      url: ${{ github.ref_name == 'main' && 'https://api.npsindore.org/api/v1/health' || 'https://api-test.npsindore.org/api/v1/health' }}
    env:
      TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      INSTALLATION_UUID: ${{ vars.HOSTINGER_GIT_INSTALLATION_UUID }}
    steps:
      - name: Start Hostinger build from ${{ github.ref_name }}
        id: build
        run: |
          set -euo pipefail
          test -n "$TOKEN" || { echo "::error::HOSTINGER_API_TOKEN secret is not set on this environment"; exit 1; }
          test -n "$INSTALLATION_UUID" || { echo "::error::HOSTINGER_GIT_INSTALLATION_UUID variable is not set on this environment"; exit 1; }
          body=$(jq -n --arg owner "${{ github.repository_owner }}" --arg repo "${{ github.event.repository.name }}" --arg branch "${{ github.ref_name }}" --arg inst "$INSTALLATION_UUID" '{
            node_version: 22, app_type: "express", package_manager: "npm", entry_file: "dist/main.js",
            root_directory: null, output_directory: null, build_script: "build",
            source_type: "git", source_options: {owner: $owner, repository: $repo, branch: $branch, installation_uuid: $inst}
          }')
          status=$(curl -sS -o response.json -w '%{http_code}' -X POST "$HOSTINGER_API/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" -d "$body")
          cat response.json; echo
          [ "$status" -lt 300 ] || { echo "::error::Hostinger rejected the build request (HTTP $status)"; exit 1; }
          uuid=$(jq -r '.uuid // .data.uuid // empty' response.json)
          test -n "$uuid" || { echo "::error::No build uuid in Hostinger response"; exit 1; }
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for build to finish
        env:
          BUILD: ${{ steps.build.outputs.uuid }}
        run: |
          set -euo pipefail
          base="$HOSTINGER_API/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/nodejs/builds/$BUILD"
          for i in $(seq 1 90); do
            state=$(curl -sS "$base" -H "Authorization: Bearer $TOKEN" -H "Accept: application/json" | jq -r '.state // .data.state // "unknown"' || echo unknown)
            echo "build $BUILD: $state"
            case "$state" in
              completed) exit 0 ;;
              failed)
                echo "::group::Build logs"; curl -sS "$base/logs" -H "Authorization: Bearer $TOKEN" -H "Accept: application/json"; echo; echo "::endgroup::"
                echo "::error::Hostinger build failed"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Build did not finish within 15 minutes"; exit 1

      # A build from Git silently turns on Hostinger's own push-to-deploy for the
      # branch, which would let pushes to main skip the approval above. Turn it off
      # again so only this workflow deploys.
      - name: Keep Hostinger auto-deploy off
        run: |
          set -euo pipefail
          body=$(jq -n --arg owner "${{ github.repository_owner }}" --arg repo "${{ github.event.repository.name }}" --arg branch "${{ github.ref_name }}" --arg inst "$INSTALLATION_UUID" \
            '{installation_uuid: $inst, owner: $owner, repository: $repo, branch: $branch, is_enabled: false}')
          status=$(curl -sS -o response.json -w '%{http_code}' -X PUT "$HOSTINGER_API/accounts/$HOSTINGER_USERNAME/websites/$HOSTINGER_DOMAIN/git/auto-deployments/settings" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "Accept: application/json" -d "$body")
          cat response.json; echo
          [ "$status" -lt 300 ] || { echo "::error::Could not turn off Hostinger auto-deploy (HTTP $status)"; exit 1; }

      - name: Health check
        run: |
          for i in $(seq 1 12); do
            if curl -sS -m 10 "$PUBLIC_URL/api/v1/health" | jq -e '.ok == true' >/dev/null 2>&1; then echo "Backend is healthy at $PUBLIC_URL"; exit 0; fi
            echo "not healthy yet, retrying..."; sleep 10
          done
          echo "::error::/api/v1/health did not return ok:true after deploy"; exit 1
